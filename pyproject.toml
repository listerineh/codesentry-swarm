[project]
name = "codesentry-swarm"
version = "0.1.0"
description = "Multi-agent pull request auditor: triage, sandboxed tests and a typed verdict, with a fully offline demo mode."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "rich>=13.9",
    # The subprocess sandbox runs pytest from this environment.
    "pytest>=8.3",
]

[project.optional-dependencies]
gcp = [
    "google-genai>=1.40",
    "google-auth>=2.35",
    "google-cloud-firestore>=2.19",
    "google-cloud-pubsub>=2.26",
    "google-cloud-run>=0.10",
    "google-cloud-storage>=2.18",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
]

[project.scripts]
codesentry = "codesentry.cli:app"

[dependency-groups]
dev = ["pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesentry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501"]  # ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"demo/*" = ["S"]
"scripts/*" = ["S"]
"src/codesentry/sandbox_entry.py" = ["S"]
"src/codesentry/job_main.py" = ["S"]
